services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/init-env.sh}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/init-env.sh}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 30
  wordpress:
    image: wordpress:6.9.4-php8.3-apache
    ports:
      - "127.0.0.1:8080:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    environment:
      <<: *wp-env
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./scripts/seed.sh:/seed.sh:ro
    entrypoint: [sh, /seed.sh]
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  wp_data:
